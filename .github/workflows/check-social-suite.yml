name: check-social-suite

on:
  push:
    branches: [main]
    paths: ['social-suite/**']
  pull_request:
    paths: ['social-suite/**']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: social-suite/package-lock.json
      - run: npm ci
      - run: npm run check
