name: check-leadspanic-instagram

on:
  push:
    branches: [main]
    paths: ['leadspanic-instagram/**']
  pull_request:
    paths: ['leadspanic-instagram/**']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leadspanic-instagram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: leadspanic-instagram/package-lock.json
      - run: npm ci
      - run: npm run check
